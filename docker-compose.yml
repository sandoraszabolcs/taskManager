services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5434:5432"]  # host 5432 is used by a local PostgreSQL
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6380:6379"]  # host 6379 is used by a local Redis

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    env_file: .env
    command: python -m app.workers.task_worker
    volumes: [./backend:/app]
    depends_on: [postgres, redis]

  frontend:
    build: ./frontend
    env_file: .env
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [api]

volumes:
  pgdata:
